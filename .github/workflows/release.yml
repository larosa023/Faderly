name: Release

# Push a tag like v1.2.3 to build Faderly and publish Faderly-win-Setup.exe
# (plus the update packages the built-in updater downloads) to GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Read version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish app
        run: >
          dotnet publish src/Faderly/Faderly.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      # Pulls the previous release so vpk can build small delta updates.
      - name: Download previous release
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: >
          vpk pack
          -u Faderly
          -v ${{ steps.version.outputs.value }}
          -p publish
          -e Faderly.exe
          --packTitle Faderly
          -i src/Faderly/Assets/Faderly.ico

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "Faderly ${{ steps.version.outputs.value }}"
          --tag v${{ steps.version.outputs.value }}
          --token ${{ secrets.GITHUB_TOKEN }}
